services:
  postgres:
    image: postgres:16
    container_name: gestor-vehiculos-db
    # CORRECCIÓN: Se agrega 'postgres' al inicio del comando
    command: postgres -c timezone=UTC
    environment:
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gestor_vehiculos
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U gestor -d gestor_vehiculos
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    container_name: gestor-vehiculos-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/gestor_vehiculos
      DB_USERNAME: gestor
      DB_PASSWORD: password123

volumes:
  postgres_data:
