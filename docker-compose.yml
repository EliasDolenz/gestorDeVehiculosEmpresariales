services:
  postgres:
    image: postgres:16
    container_name: gestor-vehiculos-db
    # CORRECCIÓN: Se agrega 'postgres' al inicio del comando
    command: postgres -c timezone=UTC
    environment:
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gestor_vehiculos
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
